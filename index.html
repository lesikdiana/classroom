<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивна навігація</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
        }
        
        nav {
            background: #333;
            padding: 15px 20px;
        }
        
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }
        
        .burger {
            display: none;
            font-size: 30px;
            color: white;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        #burger-checkbox {
            display: none;
        }
        
        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }
        
        .nav-links li {
            position: relative;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 10px;
            display: block;
        }
        
        .nav-links a:hover {
            background: #555;
            border-radius: 5px;
        }
        
        .nav-links li:first-child a {
            background: #ff6600;
            border-radius: 5px;
        }
        
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #444;
            list-style: none;
            min-width: 150px;
            border-radius: 5px;
        }
        
        .dropdown-menu li a {
            padding: 10px;
        }
        
        .dropdown:hover .dropdown-menu {
            display: block;
        }
        
        .search-form {
            display: flex;
            gap: 5px;
        }
        
        .search-form input {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
        }
        
        .search-form button {
            padding: 5px 10px;
            background: #ff6600;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            color: white;
        }
        
        @media (max-width: 992px) {
            .search-form input {
                width: 120px;
            }
        }
        
        @media (max-width: 768px) {
            .burger {
                display: block;
            }
            
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                margin-top: 15px;
                gap: 5px;
            }
            
            #burger-checkbox:checked + .burger + .nav-links {
                display: flex;
            }
            
            .dropdown-menu {
                position: static;
                margin-left: 20px;
                display: none;
            }
            
            .dropdown:focus-within .dropdown-menu,
            .dropdown:hover .dropdown-menu {
                display: block;
            }
            
            .search-form {
                width: 100%;
            }
            
            .search-form input {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-header">
            <a href="#" class="logo">🐱 CatSite</a>
            <input type="checkbox" id="burger-checkbox">
            <label for="burger-checkbox" class="burger">☰</label>
            
            <ul class="nav-links">
                <li><a href="#">Головна</a></li>
                <li><a href="#">Про нас</a></li>
                
                <li class="dropdown">
                    <a href="#">Послуги ▼</a>
                    <ul class="dropdown-menu">
                        <li><a href="#">Догляд за котами</a></li>
                        <li><a href="#">Вигул котів</a></li>
                        <li><a href="#">Готель для котів</a></li>
                    </ul>
                </li>
                
                <li><a href="#">Контакти</a></li>
                
                <li>
                    <form class="search-form" action="#">
                        <input type="search" placeholder="Пошук...">
                        <button type="submit">🔍</button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>

    <div style="padding: 40px; text-align: center;">
        <h1>Ласкаво просимо на сайт про котів! 🐾</h1>
        <p>натисніть "Послуги"</p>
        <p style="margin-top: 20px;">Активний пункт: <strong style="color: #ff6600;">Головна</strong></p>
    </div>

</body>
</html>
